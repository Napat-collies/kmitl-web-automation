[project]
name = "kmitl-web-automation"
version = "0.1.0"
description = "Agentic web search + browser automation demo for KMITL LLM Lecture 12"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.40",
    "trafilatura>=1.12",
    "playwright>=1.47",
]

[tool.uv]
# This is an application, not a library — don't try to build/install it as a package;
# just manage the virtualenv of dependencies. Run it with `uv run uvicorn app.main:app`.
package = false
